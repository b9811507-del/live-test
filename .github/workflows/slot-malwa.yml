name: slot-malwa
on:
  schedule:
    - cron: "15 5 * * *"   # prebuild+translate
    - cron: "29 5 * * *"   # 05:29 UTC = announce 10:59 IST, test till ~11:1x
    - cron: "50 5 * * *"    # resume-finish if interrupted
  workflow_dispatch: { }
permissions: { contents: write, actions: write }
concurrency: { group: slot-malwa, cancel-in-progress: false }
jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          S="${{ github.event.schedule }}"
          if [ "$S" = "15 5 * * *" ]; then python3 engine/engine.py prebuild $JOB; exit 0; fi
          if [ "$S" = "50 5 * * *" ]; then python3 engine/engine.py finish $JOB; else python3 engine/engine.py run $JOB; fi
