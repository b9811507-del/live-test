name: slot-iari
on:
  schedule:
    - cron: "45 8 * * *"   # prebuild+translate
    - cron: "59 8 * * *"   # 05:29 UTC = announce 1:29 PM IST
    - cron: "15 9 * * *"    # resume-finish if interrupted
  workflow_dispatch: { }
permissions: { contents: write, actions: write }
concurrency: { group: slot-iari, cancel-in-progress: false }
jobs:
  slot:
    runs-on: ubuntu-latest
    env:
      JOB: iari
      MONGO_URI: ${{ secrets.MONGO_URI }}
      TZ: Asia/Kolkata
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo || true
      - name: run
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          S="${{ github.event.schedule }}"
          if [ "$S" = "45 8 * * *" ]; then python3 engine/engine.py prebuild $JOB; exit 0; fi
          if [ "$S" = "15 9 * * *" ]; then python3 engine/engine.py finish $JOB; else python3 engine/engine.py run $JOB; fi
