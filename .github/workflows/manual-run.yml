name: manual-run
# TEMPORARY — owner-approved late-start runner (27-Sep malwa). DELETE after use.
# v12 keeps only slot-chain.yml + afo-supply.yml. Same concurrency group as
# slot-chain so it serializes with the live chain (no state races).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "job key (malwa/iari/afo)"
        required: true
        default: "malwa"
permissions:
  contents: write
  actions: write
concurrency:
  group: slot-chain
  cancel-in-progress: false
jobs:
  force:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      IARI_CHAT: ${{ secrets.IARI_CHAT }}
      PAID_SHOWCASE: "on"
      PAID_BOT_TOKEN: ${{ secrets.PAID_BOT_TOKEN }}
      PAID_PRICE_AFO: ${{ secrets.PAID_PRICE_AFO }}
      PAID_PRICE_PASHU: ${{ secrets.PAID_PRICE_PASHU }}
      PAID_PRICE_CANE: ${{ secrets.PAID_PRICE_CANE }}
      PAID_PRICE_MALWA: ${{ secrets.PAID_PRICE_MALWA }}
      PAID_PRICE_IARI: ${{ secrets.PAID_PRICE_IARI }}
      PAID_PRICE_NEMRAJ: ${{ secrets.PAID_PRICE_NEMRAJ }}
      PAID_PRICE_RKSHARMA: ${{ secrets.PAID_PRICE_RKSHARMA }}
      PAID_CHAT_AFO: ${{ secrets.PAID_CHAT_AFO }}
      PAID_CHAT_PASHU: ${{ secrets.PAID_CHAT_PASHU }}
      PAID_CHAT_CANE: ${{ secrets.PAID_CHAT_CANE }}
      PAID_CHAT_MALWA: ${{ secrets.PAID_CHAT_MALWA }}
      PAID_CHAT_IARI: ${{ secrets.PAID_CHAT_IARI }}
      PAID_CHAT_NEMRAJ: ${{ secrets.PAID_CHAT_NEMRAJ }}
      PAID_CHAT_RKSHARMA: ${{ secrets.PAID_CHAT_RKSHARMA }}
      PAID_VERIFY: "auto"
      PAID_WEBHOOK_SECRET: ${{ secrets.PAID_WEBHOOK_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      POLL_SECONDS: "25"
      LATE_MAX_MIN: "5"
      DEFER_SECS: "0"
      COUNTDOWN_SECS: "15"
      ANNOUNCE_LEAD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo requests
      - name: unseal + run now (owner approved late start)
        run: |
          JOB="${{ inputs.job }}"
          echo "Force-starting $JOB now (owner approved)"
          python3 - "$JOB" <<'EOF'
          import sys
          job = sys.argv[1]
          sys.path.insert(0, 'engine')
          import engine as E
          st = E.jload(force=True)
          day = E.daykey()
          j = E.job_j(st, day, job)
          for k in ("missed","late_sealed","done_at","blocked","killed","closed","sealed",
                    "started_at","announced_at","msg_ann","announce_msg_id","msg_timer",
                    "pinned_ann","unpinned","locked_by","lock_ts","qidx","plan"):
              j.pop(k, None)
          j["step"] = 0
          E.jsave(st, "%s manual late start (owner approved)" % job)
          print("UNSEALED", job, day, "step=", j.get("step"), flush=True)
          E.run_job(job, day, st)
          EOF
