name: pre-check
# 20 min before each test — verify everything, auto-fix, ensure on-time start
# Runs every 10 min, but only does heavy checks when next slot within 20 min
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"   # every 10 min UTC = every 10 min IST (offset constant)
  push:
    branches: [main]
    paths: [".github/workflows/pre-check.yml", "engine/precheck.py", "engine/engine.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: pre-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      PAID_BOT_TOKEN: ${{ secrets.PAID_BOT_TOKEN }}
      PAID_TOKEN: ${{ secrets.PAID_TOKEN }}
      PAID_WEBHOOK_SECRET: ${{ secrets.PAID_WEBHOOK_SECRET }}
      PAID_SHOWCASE: "on"
      PAID_VERIFY: "auto"
      PAID_PRICE_AFO: ${{ secrets.PAID_PRICE_AFO }}
      PAID_PRICE_PASHU: ${{ secrets.PAID_PRICE_PASHU }}
      PAID_PRICE_CANE: ${{ secrets.PAID_PRICE_CANE }}
      PAID_PRICE_MALWA: ${{ secrets.PAID_PRICE_MALWA }}
      PAID_PRICE_IARI: ${{ secrets.PAID_PRICE_IARI }}
      PAID_PRICE_NEMRAJ: ${{ secrets.PAID_PRICE_NEMRAJ }}
      PAID_PRICE_RKSHARMA: ${{ secrets.PAID_PRICE_RKSHARMA }}
      PAID_CHAT_AFO: ${{ secrets.PAID_CHAT_AFO }}
      PAID_CHAT_PASHU: ${{ secrets.PAID_CHAT_PASHU }}
      PAID_CHAT_CANE: ${{ secrets.PAID_CHAT_CANE }}
      PAID_CHAT_MALWA: ${{ secrets.PAID_CHAT_MALWA }}
      PAID_CHAT_IARI: ${{ secrets.PAID_CHAT_IARI }}
      PAID_CHAT_NEMRAJ: ${{ secrets.PAID_CHAT_NEMRAJ }}
      PAID_CHAT_RKSHARMA: ${{ secrets.PAID_CHAT_RKSHARMA }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo requests
      - name: pre-check 20 min before slot
        run: python3 engine/precheck.py
      - name: rearm slot-chain if needed
        if: always()
        run: |
          H=$(date +%H); M=$(date +%M); NOW=$((10#$H * 60 + 10#$M))
          for GO in 660 870 1080; do
            DIFF=$((GO - NOW))
            if [ "$DIFF" -ge 0 ] && [ "$DIFF" -le 25 ]; then
              echo "Within 25 min of slot $GO (diff $DIFF) -> dispatch slot-chain"
              python3 engine/engine.py dispatch slot-chain.yml || true
              break
            fi
            if [ "$DIFF" -lt 0 ] && [ "$DIFF" -ge -15 ]; then
              echo "Slot $GO overdue by $(( -DIFF )) min (<15) -> dispatch slot-chain"
              python3 engine/engine.py dispatch slot-chain.yml || true
              break
            fi
          done
