name: slot-chain
# MAIN DISPATCHER (SPEC v11 §7): one short cycle for all three jobs, then it re-arms itself.
#  * schedule() cron on this account is unreliable -> cron is a BACKSTOP only; the chain self-chains
#    via workflow_dispatch with the runner token.
#  * concurrency NEVER cancels: a live 30s-per-question test must not be killed mid-poll.
#  * brand-new workflow files 404 on dispatch until they exist on the default branch -> push trigger
#    on this file (+ engine) self-registers it.
#  * NO inline python here on purpose (multi-line YAML run: | + heredoc traps) — engine/engine.py only.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"        # backstop only (UTC; job times are computed in IST inside the engine)
  push:
    branches: [main]
    paths: [".github/workflows/slot-chain.yml", "engine/engine.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: slot-chain
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      IARI_CHAT: ${{ secrets.IARI_CHAT }}
      # paid batches (last message after every test): payment links/price/chat per batch
      PAID_SHOWCASE: "on"
      PAID_BOT_TOKEN: ${{ secrets.PAID_BOT_TOKEN }}
      PAID_LINK_AFO: ${{ secrets.PAID_LINK_AFO }}
      PAID_LINK_PASHU: ${{ secrets.PAID_LINK_PASHU }}
      PAID_LINK_CANE: ${{ secrets.PAID_LINK_CANE }}
      PAID_PRICE_AFO: ${{ secrets.PAID_PRICE_AFO }}
      PAID_PRICE_PASHU: ${{ secrets.PAID_PRICE_PASHU }}
      PAID_PRICE_CANE: ${{ secrets.PAID_PRICE_CANE }}
      PAID_PRICE_MALWA: ${{ secrets.PAID_PRICE_MALWA }}
      PAID_PRICE_IARI: ${{ secrets.PAID_PRICE_IARI }}
      PAID_PRICE_NEMRAJ: ${{ secrets.PAID_PRICE_NEMRAJ }}
      PAID_PRICE_RKSHARMA: ${{ secrets.PAID_PRICE_RKSHARMA }}
      PAID_CHAT_AFO: ${{ secrets.PAID_CHAT_AFO }}
      PAID_CHAT_PASHU: ${{ secrets.PAID_CHAT_PASHU }}
      PAID_CHAT_CANE: ${{ secrets.PAID_CHAT_CANE }}
      PAID_CHAT_MALWA: ${{ secrets.PAID_CHAT_MALWA }}
      PAID_CHAT_IARI: ${{ secrets.PAID_CHAT_IARI }}
      PAID_CHAT_NEMRAJ: ${{ secrets.PAID_CHAT_NEMRAJ }}
      PAID_CHAT_RKSHARMA: ${{ secrets.PAID_CHAT_RKSHARMA }}
      PAID_VERIFY: ${{ secrets.PAID_VERIFY }}
      # Razorpay payment links (v11.3)
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo
      - name: cycle
        run: python3 engine/engine.py slotchain || true
      # Low-burn (16-Sep): outside 10:00-19:15 IST the chain does NOT re-arm itself; the */10 cron
      # backstop wakes it. Inside the window the tight self-chain is kept (punctual slots).
      - name: rearm (jitter 100-190s, window only)
        if: always()
        env:
          TZ: Asia/Kolkata
        run: |
          H=$(date +%H); M=$(date +%M); NOW=$((10#$H * 60 + 10#$M))
          if [ "$NOW" -ge 600 ] && [ "$NOW" -le 1155 ]; then
            python3 engine/engine.py dispatch slot-chain.yml || true
            sleep $(( (RANDOM % 91) + 100 ))
          else
            echo "outside the test window ($H:$M IST) -> not re-arming (saving Actions minutes)"
          fi
          python3 engine/engine.py rearm || true
