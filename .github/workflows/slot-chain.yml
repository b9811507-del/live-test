name: slot-chain
# v12 SIMPLE — One main workflow only (user order: simple rakho, bina kaam ka delete)
# - v12.2 SLEEP MODE END: self-chain 24/7 (60s near slots/daytime, 300s night) + cron backstop
# - 20 min before slot: verify EXAM webhook empty, PAID webhook set, Worker alive, can_post, batch admin — auto-fix
# - Exact time SHARP: announce 11:00:00/14:30:00/18:00:00 -> 0.5s -> timer "15".."1" (numbers only) -> 0.5s -> polls 25s gap 0.5s
# - Last message after every test = paid batches (most important)
# - LATE_MAX 5 min hard (max 3-5 min late only, user order)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"        # every 5 min — backstop, tight for on-time
  push:
    branches: [main]
    paths: [".github/workflows/slot-chain.yml", "engine/engine.py", "engine/precheck.py", "engine/paid.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: slot-chain
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      IARI_CHAT: ${{ secrets.IARI_CHAT }}
      PAID_SHOWCASE: "on"          # v12: paid batch LAST message must come after every test (user order)
      PAID_BOT_TOKEN: ${{ secrets.PAID_BOT_TOKEN }}
      PAID_PRICE_AFO: ${{ secrets.PAID_PRICE_AFO }}
      PAID_PRICE_PASHU: ${{ secrets.PAID_PRICE_PASHU }}
      PAID_PRICE_CANE: ${{ secrets.PAID_PRICE_CANE }}
      PAID_PRICE_MALWA: ${{ secrets.PAID_PRICE_MALWA }}
      PAID_PRICE_IARI: ${{ secrets.PAID_PRICE_IARI }}
      PAID_PRICE_NEMRAJ: ${{ secrets.PAID_PRICE_NEMRAJ }}
      PAID_PRICE_RKSHARMA: ${{ secrets.PAID_PRICE_RKSHARMA }}
      PAID_CHAT_AFO: ${{ secrets.PAID_CHAT_AFO }}
      PAID_CHAT_PASHU: ${{ secrets.PAID_CHAT_PASHU }}
      PAID_CHAT_CANE: ${{ secrets.PAID_CHAT_CANE }}
      PAID_CHAT_MALWA: ${{ secrets.PAID_CHAT_MALWA }}
      PAID_CHAT_IARI: ${{ secrets.PAID_CHAT_IARI }}
      PAID_CHAT_NEMRAJ: ${{ secrets.PAID_CHAT_NEMRAJ }}
      PAID_CHAT_RKSHARMA: ${{ secrets.PAID_CHAT_RKSHARMA }}
      PAID_VERIFY: "auto"
      PAID_WEBHOOK_SECRET: ${{ secrets.PAID_WEBHOOK_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # v12 simple timing
      POLL_SECONDS: "25"
      LATE_MAX_MIN: "5"
      DEFER_SECS: "0"
      COUNTDOWN_SECS: "15"
      ANNOUNCE_LEAD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo requests
      - name: pre-check 20 min before (verify + auto-fix)
        run: |
          H=$(date +%H); M=$(date +%M); NOW=$((10#$H * 60 + 10#$M))
          for GO in 660 870 1080; do
            DIFF=$((GO - NOW))
            if [ "$DIFF" -ge 0 ] && [ "$DIFF" -le 25 ]; then
              echo "=== 20 MIN BEFORE SLOT $GO (diff $DIFF min) — running full verification ==="
              python3 engine/precheck.py || true
              break
            fi
            if [ "$DIFF" -lt 0 ] && [ "$DIFF" -ge -5 ]; then
              echo "=== SLOT $GO OVERDUE by $(( -DIFF )) min (within 5) — verify ==="
              python3 engine/precheck.py || true
              break
            fi
          done
      - name: cycle (announce → timer 15s → polls 25s gap 0.5s → LB → paid LAST)
        run: python3 engine/engine.py slotchain || true
      - name: rearm (simple, 60 sec, 180 min pre-slot to prevent gap)
        if: always()
        env:
          TZ: Asia/Kolkata
        run: |
          H=$(date +%H); M=$(date +%M); NOW=$((10#$H * 60 + 10#$M))
          SLEEP=300
          # v12.2 user order: SLEEP MODE END - chain re-arms 24/7. 60s when near slot/daytime, 300s at night.
          for GO in 660 870 1080; do
            DIFF=$((GO - NOW))
            if [ "$DIFF" -ge -15 ] && [ "$DIFF" -le 180 ]; then SLEEP=60; echo "Near slot $GO (diff $DIFF) -> 60s"; break; fi
          done
          if [ "$NOW" -ge 600 ] && [ "$NOW" -le 1155 ]; then SLEEP=60; echo "Daytime 10:00-19:15 -> 60s"; fi
          echo "Sleep mode END (user order): re-arm 24/7 in ${SLEEP}s"
          sleep $SLEEP
          python3 engine/engine.py dispatch slot-chain.yml || true
