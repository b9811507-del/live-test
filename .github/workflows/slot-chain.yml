name: slot-chain
# v10 test scheduler — self-chaining dispatcher (cron is only a 30-min backstop; the
# workflow re-dispatches itself every cycle, because GHA `schedule` on this account
# demonstrably skips/lags hours). DO NOT enable cancel-in-progress: it would kill a
# live test mid-poll. The engine journal (state.json steps) makes resume idempotent.
on:
  workflow_dispatch: { }
  schedule:
    - cron: "*/30 * * * *"
permissions: { contents: write, actions: write }
concurrency: { group: slot-chain, cancel-in-progress: false }
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo || true
      - name: one cycle
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IARI_CHAT: ${{ secrets.IARI_CHAT }}
          MALWA_CHAT: ${{ secrets.MALWA_CHAT }}
          AFO_CHAT: ${{ secrets.AFO_CHAT }}
        run: |
          for i in 1 2; do
            python3 engine/engine.py slotchain && break
            echo "cycle attempt $i failed — retrying once"; sleep 15
          done || true
      - name: rearm next cycle
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep $(( (RANDOM % 90) + 100 ))
          gh workflow run slot-chain.yml --repo "${{ github.repository }}" --ref main || true
