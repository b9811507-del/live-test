name: slot-kill
# EMERGENCY STOP (SPEC v11 §7). dispatch-only: the push trigger exists ONLY to register the file on
# the default branch (new workflow files 404 on dispatch until they are on main); the job skips
# itself for every event except workflow_dispatch, so a normal push can never kill the chain.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/slot-kill.yml", "agents/kill.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: slot-kill
  cancel-in-progress: false
jobs:
  kill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: emergency stop
        run: python3 agents/kill.py || true
