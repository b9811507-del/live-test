name: booksend (one-off page-files delivery)
on:
  workflow_dispatch:
    inputs:
      job:    {description: "job key (iari/malwa/...)", default: "iari", type: string}
      range:  {description: "pages lo-hi (empty = full sheet)", default: "1-1074", type: string}
      step:   {description: "pages per file", default: "5", type: string}
      chat:   {description: "target chat id", default: "-1003922097468", type: string}
permissions: { contents: write, actions: write }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: deliver
        run: |
          TG_TOKEN="${{ secrets.PAID_TOKEN }}" \
          CHAT_ID="${{ github.event.inputs.chat }}" \
          ADMIN_CHAT="${{ secrets.ADMIN_CHAT }}" \
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          python3 engine/engine.py booksend "${{ github.event.inputs.job }}" "${{ github.event.inputs.range }}" "${{ github.event.inputs.step }}"
