name: agent-doctor
on:
  schedule:
    - cron: "*/30 * * * *"      # read failed runs, auto-fix / re-run, DM admin
  workflow_dispatch:
permissions: { contents: write, actions: write, checks: read }
concurrency: { group: doctor, cancel-in-progress: false }
jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
        run: python3 agents/doctor.py
