name: keepwarm+agent
on:
  schedule:
    - cron: "*/5 * * * *"     # keep Render awake + wake poller + self-heal (5 min = faster loopfix)
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: warm, cancel-in-progress: true }
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 engine/engine.py keepwarm || true
          python3 engine/engine.py agent || true
      - name: rearm
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHA schedule queue lags HOURS (observed) -> Render sleeps -> paid bot = no response.
          # Chain ourselves instead: each run sleeps ~4 min then re-dispatches. Dispatch does
          # NOT wait in the schedule queue. concurrency=cancel collapses any duplicates, and
          # */5 cron below is only a backstop if the chain ever dies.
          sleep $(( (RANDOM % 60) + 210 ))
          gh workflow run keepwarm-agent.yml --repo b9811507-del/live-test --ref main || true
      - name: booksend trigger relay
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f BOOKSEND_GO ]; then
            python3 - <<'PYEOF'
            import json, os, urllib.request
            tok = os.environ["GH_TOKEN"]
            inp = json.load(open("BOOKSEND_GO"))
            req = urllib.request.Request(
                "https://api.github.com/repos/b9811507-del/live-test/actions/workflows/booksend.yml/dispatches",
                method="PUT", data=json.dumps({"ref": "main", "inputs": inp}).encode(),
                headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
            try:
                urllib.request.urlopen(req, timeout=15); print("booksend dispatched:", inp)
            except Exception as e:
                print("dispatch fail (marker kept for next cycle):", e); raise SystemExit(0)
            PYEOF
            git rm -q BOOKSEND_GO
            git -c user.name=live-test-bot -c user.email=bot@local commit -qm "clear booksend marker"
            P="https://runner:${GH_TOKEN}@github.com/b9811507-del/live-test"
            git push -q $P HEAD:main || { git fetch -q $P main && git rebase -q FETCH_HEAD && git push -q $P HEAD:main; } || true
          fi

