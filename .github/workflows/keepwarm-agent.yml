name: keepwarm+agent
on:
  schedule:
    - cron: "*/5 * * * *"     # keep Render awake + wake poller + self-heal (5 min = faster loopfix)
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: warm, cancel-in-progress: true }
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RENDER_URL: ${{ secrets.RENDER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 engine/engine.py keepwarm || true
          python3 engine/engine.py agent || true
      - name: gha dispatch relay
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 agents/relay.py
      - name: rearm
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Chain: dispatch-then-work (a cancelled mid-sleep job KILLED the whole chain on
          # 2026-09-14: queued runs got cancelled by the next dispatch before reaching steps).
          # Cadence throttle: skip dispatch if a cycle ran < 150s ago (job itself lasts ~2 min).
          AGE=$(gh api "repos/b9811507-del/live-test/actions/runs?per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null | tr -d '"')
          if [ -n "$AGE" ]; then
            A=$(python3 -c "import time,calendar;print(int(time.time()-calendar.timegm(time.strptime('$AGE','%Y-%m-%dT%H:%M:%S'))))" 2>/dev/null || echo 999)
            if [ "$A" -lt 150 ]; then echo "throttled (last dispatch ${A}s ago) — no new dispatch"; exit 0; fi
          fi
          gh workflow run keepwarm-agent.yml --repo b9811507-del/live-test --ref main || true
          sleep 20   # pad so the dispatched run registers before this job ends
