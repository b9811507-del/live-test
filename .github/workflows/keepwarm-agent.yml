name: keepwarm-agent
# Keepwarm + maintenance (SPEC v11 §7): Render ping, engine agent pass (journal audit + daily AFO
# supply audit), relay marker dispatch, then it re-dispatches itself and throttles ~150s.
# DISPATCH FIRST, then sleep (so a queued sibling can never cancel this runner before its steps ran).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"         # low-burn (16-Sep): cron is now the only trigger
  push:
    branches: [main]
    paths: [".github/workflows/keepwarm-agent.yml", "engine/engine.py", "agents/relay.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: keepwarm-agent
  cancel-in-progress: false
jobs:
  keepwarm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Kolkata
      EXAM_TG_TOKEN: ${{ secrets.EXAM_TG_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      # enrolment desk: same payment config as the chain + Telegram Payments (optional)
      PAID_BOT_TOKEN: ${{ secrets.PAID_BOT_TOKEN }}
      PAID_LINK_AFO: ${{ secrets.PAID_LINK_AFO }}
      PAID_LINK_PASHU: ${{ secrets.PAID_LINK_PASHU }}
      PAID_LINK_CANE: ${{ secrets.PAID_LINK_CANE }}
      PAID_PRICE_AFO: ${{ secrets.PAID_PRICE_AFO }}
      PAID_PRICE_PASHU: ${{ secrets.PAID_PRICE_PASHU }}
      PAID_PRICE_CANE: ${{ secrets.PAID_PRICE_CANE }}
      PAID_PRICE_MALWA: ${{ secrets.PAID_PRICE_MALWA }}
      PAID_PRICE_IARI: ${{ secrets.PAID_PRICE_IARI }}
      PAID_PRICE_NEMRAJ: ${{ secrets.PAID_PRICE_NEMRAJ }}
      PAID_PRICE_RKSHARMA: ${{ secrets.PAID_PRICE_RKSHARMA }}
      PAID_CHAT_AFO: ${{ secrets.PAID_CHAT_AFO }}
      PAID_CHAT_PASHU: ${{ secrets.PAID_CHAT_PASHU }}
      PAID_CHAT_CANE: ${{ secrets.PAID_CHAT_CANE }}
      PAID_CHAT_MALWA: ${{ secrets.PAID_CHAT_MALWA }}
      PAID_CHAT_IARI: ${{ secrets.PAID_CHAT_IARI }}
      PAID_CHAT_NEMRAJ: ${{ secrets.PAID_CHAT_NEMRAJ }}
      PAID_CHAT_RKSHARMA: ${{ secrets.PAID_CHAT_RKSHARMA }}
      PAY_PROVIDER_TOKEN: ${{ secrets.PAY_PROVIDER_TOKEN }}
      PAID_VERIFY: ${{ secrets.PAID_VERIFY }}
      # Razorpay payment links (v11.3)
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RENDER_URL: ${{ secrets.RENDER_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SVC: ${{ secrets.RENDER_SVC }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: pip install -q pymongo
      - name: keepwarm + agent maintenance
        run: python3 engine/engine.py keepwarm || true
      - name: relay (.GHA_DISPATCH.json)
        run: python3 agents/relay.py || true
      - name: rechain (dispatch first, then throttle 150s)
        if: always()
        run: |
          # Low-burn (16-Sep): self-chain removed (it burned ~1,025 min/day). The */5 cron runs the desk.
          echo "keepwarm cycle done (self-chain disabled to save Actions minutes)"
